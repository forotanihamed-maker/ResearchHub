name: AI triage
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: ai-triage
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call triage endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET" || { echo "APP_URL/CRON_SECRET not set"; exit 1; }
          curl --fail --silent --show-error --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/triage"
